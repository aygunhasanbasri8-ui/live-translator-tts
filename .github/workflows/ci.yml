name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # PyQt6'nın offscreen eklentisi bile birkaç X/EGL kütüphanesi istiyor
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[dev,llm]"
      - run: python -m pytest -q -m "not windows_audio and not network and not live"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[shortcuts,audio,build]"
      - run: python -m PyInstaller --noconfirm live_translator_klasor.spec
      - name: Duman testi (donmuş exe açılıyor mu)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist\CanliCevirmen_klasor\CanliCevirmen.exe -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke başarısız: $($p.ExitCode)" }
      - name: Boyut kapısı
        shell: pwsh
        run: |
          $mb = (Get-ChildItem dist\CanliCevirmen_klasor -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "onedir: {0:N0} MB" -f $mb | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # Bugün ~222 MB; Whisper zinciri gibi ağır bir paket yanlışlıkla girerse burada yakalansın
          if ($mb -gt 260) { throw "boyut bütçesi aşıldı (>260 MB)" }
      - uses: actions/upload-artifact@v4
        with:
          name: CanliCevirmen-onedir
          path: dist/CanliCevirmen_klasor
          retention-days: 14
