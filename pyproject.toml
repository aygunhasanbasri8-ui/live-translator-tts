[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-translator"
version = "0.1.0"
description = "Windows system-audio translator with subtitles and optional dubbing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "PyAudioWPatch>=0.2.12",
    "SpeechRecognition>=3.10",
    "deep-translator>=1.11",
    "edge-tts>=6.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
shortcuts = ["keyboard>=0.13", "pynput>=1.7"]
audio = ["pygame>=2.5"]
dev = ["pytest>=8"]

[project.scripts]
live-translator = "live_translator:main"

[tool.setuptools.packages.find]
include = ["live_translator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
